<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TypeTarget</title>
    <style>
      /* The popup's look (src/popup/popup.css): a Material 3 text field in the popup's colors on its
         surface. These are the popup's tokens, switching with the system theme. */
      :root {
        color-scheme: light dark;
        --tt-surface: #fff;
        --tt-text: #1f1f1f;
        --tt-text-secondary: #444746;
        --tt-primary: #0b57d0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --tt-surface: #1f1f1f;
          --tt-text: #e3e3e3;
          --tt-text-secondary: #c4c7c5;
          --tt-primary: #a8c7fa;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--tt-surface);
      }
      body {
        box-sizing: border-box;
        /* Room above the box for the destination frame (6px out) and, 4px above it, the badge's 36px row. */
        padding: 56px 16px 16px;
      }
      textarea {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        padding: 12px 16px;
        /* No border of its own: the destination frame (src/content/highlight.ts) around it is
           the box's one border, and carries the state. */
        border: none;
        border-radius: 8px;
        resize: none;
        background: var(--tt-surface);
        color: var(--tt-text);
        caret-color: var(--tt-primary);
        font: 15px/1.5 system-ui, sans-serif;
      }
      /* The destination frame (src/content/highlight.ts) already marks the box; Chrome's focus
         ring would draw a second border inside it. The new-file box gets the same from its
         `all: initial`. */
      textarea:focus {
        outline: none;
      }
      textarea::placeholder {
        color: var(--tt-text-secondary);
      }
    </style>
  </head>
  <body>
    <textarea id="text" dir="auto" spellcheck="true"></textarea>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
