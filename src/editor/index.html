<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TypeTarget file</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: Canvas;
      }
      body {
        box-sizing: border-box;
        /* Room above the box for the badge that sits on its top edge. */
        padding: 28px 16px 16px;
      }
      textarea {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        padding: 12px 16px;
        border: none;
        border-radius: 4px;
        resize: none;
        background: Canvas;
        color: CanvasText;
        font: 15px/1.5 system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <textarea id="text" aria-label="TypeTarget file" spellcheck="true" placeholder="Transcribed text appears here. You can type here too."></textarea>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
